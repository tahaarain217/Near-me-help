 <div class="row" style="flex-wrap:nowrap"><input id="ct" placeholder="Type a message" style="margin:0" onkeydown="if(event.key=='Enter')sm('${k}',${isP})"><button class="btn" onclick="sm('${k}',${isP})">Send</button></div>`}
let mr=null,chunks=[],mt=0;
async function mic(k,isP){const b=document.getElementById("mic");if(mr){mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(st);mt=Date.now();mr.ondataavailable=ev=>chunks.push(ev.data);
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const d=Math.max(1,Math.round((Date.now()-mt)/1000));mr=null;const rd=new FileReader();rd.onload=()=>sm(k,isP,"🎤 Voice message "+d+"s",rd.result);rd.readAsDataURL(new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||"audio/webm"}))};
  mr.start();if(b)b.textContent="⏹️ Stop & send";toast("Recording… tap again to send (max 60s)");setTimeout(()=>{if(mr&&mr.state=="recording")mr.stop()},60000)}
 catch(x){mr=null;toast("Microphone not available here. Sending a simulated voice note.");sm(k,isP,"🎤 Voice message (simulated, mic unavailable)")}}
function callUI(t){endCall();const o=document.createElement("div");o.id="callov";o.className="callov";o.innerHTML=`<div class="av" style="width:90px;height:90px;font-size:38px">${e(CN.slice(0,1))}</div><h2 style="margin:0">${e(CN)}</h2><p id="cs">${t=="Video call"?"🎥":"📞"} ${t}… ringing</p><span class="badge">SIMULATED – no real call is connected</span><button class="btn d" onclick="endCall()">End call</button>`;document.body.appendChild(o);setTimeout(()=>{const c=document.getElementById("cs");if(c)c.textContent="No answer. Calls are not available in this demo yet."},4000)}
function endCall(){const o=document.getElementById("callov");if(o)o.remove()}
function sm(k,isP,txt,aud){const t=txt||ct.value.trim();if(!t)return;if(aud&&aud.length>2e6)return toast("Voice note is too long");DB.msgs.push({k,f:isP?"p":"c",t,a:aud,ts:Date.now()});save();route();const c=+k.split("-")[0];
 if(!isP)setTimeout(()=>{DB.msgs.push({k,f:"s",t:"Thanks for your message! I will confirm availability shortly.",ts:Date.now()});save();if(location.hash.slice(1)=="chat-"+k)route()},1200);
 else if(DB.book.some(b=>b.demo&&b.cid==c))setTimeout(()=>{DB.msgs.push({k,f:"s",t:"Hi! Yes, please tell me your charges and when you can come. (demo customer reply)",ts:Date.now()});save();if(location.hash.slice(1)=="chat-"+k)route()},1500)}
const tn=k=>{const c=+k.split("-")[0];return U(c)?.name||DB.book.find(b=>b.cid==c&&b.dn)?.dn||"Customer"};
function openChat(cid){const u=me(),p=P(u.pid);if(!okU(u))return needV();const k=cid+"-"+p.id;if(!DB.msgs.some(m=>m.k==k)){DB.msgs.push({k,f:"p",t:"Hello! I am "+p.n+" ("+CT(p.c).n+"). I saw your request and can help.",ts:Date.now()});save()}go("chat-"+k)}
function sendOffer(id){const u=me(),p=P(u.pid);if(!okU(u)||!p.v)return toast("Verify Gmail and phone, and wait for admin approval, before sending offers");const b=DB.book.find(x=>x.id==id),fee=+document.getElementById("of"+id).value;if(!(fee>0))return toast("Enter your charges");b.offers=b.offers||[];if(b.offers.some(o=>o.pid==p.id))return toast("Offer already sent");b.offers.push({pid:p.id,fee,note:document.getElementById("on"+id).value.trim(),ts:Date.now()});save();toast("Offer sent to customer");drawP(0)}
function acc(id,i){const b=DB.book.find(x=>x.id==id),o=b.offers[i];b.pid=o.pid;b.fee=o.fee;b.st="accepted";save();toast("Offer accepted");route()}
const offs=x=>x.pid||!(x.offers||[]).length?"":`<div style="margin-top:8px"><b>Offers (${x.offers.length})</b>${x.offers.map((o,i)=>`<div class="card" style="margin-top:6px"><div class="row sp"><a href="#provider-${o.pid}">${e(P(o.pid)?.n)}</a><b>Rs ${o.fee}</b></div><div class="mu">${e(o.note||"I can help with this request.")}</div><div class="row" style="margin-top:6px"><button class="btn s" onclick="acc(${x.id},${i})">Accept offer</button><a class="btn o s" href="#chat-${x.cid}-${o.pid}">💬 Message</a></div></div>`).join("")}</div>`;

function route(){const h=location.hash.slice(1)||"home",[a,b,c]=h.split("-");let o="";
 if(a=="home")o=home();else if(a=="services")o=services();else if(a=="find"){const u=me();if(!u)o=gate("Find nearby");else if(u.role!="customer"){goTab=u.role=="provider"?"l":"o";go("dash");return}else o=find()}else if(a=="provider")o=provider(b);else if(a=="login")o=login();else if(a=="register")o=register();else if(a=="dash")o=dash();else if(a=="chat")o=chat(b,c);else o=home();
 app.innerHTML=o;navr();if(a=="find")drawFind();if(a=="dash"&&tab=="h")bdraw();if(a=="dash"&&tab=="l")drawP();const cb=document.getElementById("cb");if(cb)cb.scrollTop=1e6;if(a!="dash"&&a!="chat")scrollTo(0,0)}
window.addEventListener("hashchange",()=>{tab=goTab;goTab="";route()});route();
</script></body></html>
