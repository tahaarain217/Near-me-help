<html lang="en"><head><meta charset="utf-8">

<style>
:root{--n:#071a3a;--n2:#0f3566;--t:#14c8b4;--bg:#f3f7fb;--c:#fff;--tx:#0f1f33;--mu:#5b6b7e;--bd:#dce5ee;--warn:#fff4d6;--wt:#7a5a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}

.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:var(--t);color:#04302b}.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.d{background:#e5484d;color:#fff}.btn.s{padding:6px 10px;font-size:13px}.btn.n{background:var(--n);color:#fff}

.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:var(--warn);color:var(--wt);vertical-align:middle}.badge.g{background:#d4f5ee;color:#0b6b5c}
.st{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}.pending{background:#d19a00}.accepted{background:#2f7ff0}.rejected{background:#e5484d}.in-progress{background:#8b5cf6}.completed{background:#17a673}.cancelled{background:#7b8794}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--tx);font:inherit;margin:4px 0 10px}label{font-weight:600;font-size:13px}
.note{background:var(--warn);color:var(--wt);border-radius:10px;padding:8px 12px;font-size:13px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--c);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}.tabs button.on{background:var(--n);color:#fff;border-color:var(--n)}
.av{width:46px;height:46px;border-radius:50%;background:var(--n);color:var(--t);display:grid;place-items:center;font-size:22px;flex:none}
.map{width:100%;height:auto;background:#e8f3f4;border-radius:14px;border:1px solid var(--bd)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .map{background:#0a1d33}}
.chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border-radius:12px;border:1px solid var(--bd)}.m{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--c);border:1px solid var(--bd)}.m.me{align-self:flex-end;background:var(--t);color:#04302b;border:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
footer{background:var(--n);color:#9db4cc;text-align:center;padding:22px 16px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:30px;z-index:50;display:none}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sh{to{background-position:200% 0}}
main>*{animation:up .55s ease both}main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}
.grid>.card{animation:up .5s ease both}
.card{box-shadow:0 2px 10px rgba(7,26,58,.06);transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{box-shadow:0 12px 28px rgba(7,26,58,.14)}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,200,180,.35);filter:brightness(1.06)}
header{background:rgba(7,26,58,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
nav .l a{transition:background .2s,color .2s}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#071a3a,#0f3566 60%,#0b5e6b)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;animation:fl 7s ease-in-out infinite}
.hero::before{width:260px;height:260px;right:-60px;top:-70px;background:radial-gradient(circle,rgba(20,200,180,.45),transparent 70%)}
.hero::after{width:180px;height:180px;right:25%;bottom:-70px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);animation-delay:-3s}
.hero>*{position:relative;z-index:1}
.hero em{background:linear-gradient(90deg,#14c8b4,#8af5e8,#14c8b4);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.cat b{transition:transform .25s}.cat:hover b{transform:scale(1.2) rotate(-6deg)}
.auth{display:grid;grid-template-columns:1fr 1fr;max-width:900px;margin:10px auto;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(7,26,58,.22);background:var(--c);border:1px solid var(--bd)}
.auth .side{background:linear-gradient(160deg,#071a3a,#0f3566 55%,#0b6b72);color:#fff;padding:36px 30px;position:relative;overflow:hidden}
.auth .side::after{content:"";position:absolute;width:220px;height:220px;right:-60px;bottom:-60px;border-radius:50%;background:radial-gradient(circle,rgba(20,200,180,.5),transparent 70%);animation:fl 6s ease-in-out infinite}
.auth .side ul{padding-left:18px}.auth .side li{margin:10px 0;color:#d5e6f7}
.auth .form{padding:32px 28px}.auth .form .btn{width:100%;padding:12px}
@media(max-width:720px){.auth{grid-template-columns:1fr}.auth .side{padding:24px}}
.dsh{--c:rgba(18,36,68,.78);--bg:#08142b;--tx:#e8f0f8;--mu:#9aabbf;--bd:#1f3654;--warn:#3a2f0b;--wt:#ffd76a;color-scheme:dark;display:grid;grid-template-columns:210px 1fr;border-radius:22px;overflow:hidden;color:var(--tx);background:radial-gradient(900px 400px at 85% -10%,rgba(20,200,180,.18),transparent),radial-gradient(700px 400px at 0 100%,rgba(109,124,255,.2),transparent),#071327;border:1px solid var(--bd);min-height:600px;box-shadow:0 24px 60px rgba(7,26,58,.35)}
.dsb{padding:18px 12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}.dsb .logo{margin:0 8px 16px}
.si{padding:9px 12px;border-radius:10px;color:#b7c7da;cursor:pointer;transition:.2s;font-weight:500}.si:hover{background:rgba(255,255,255,.06);color:#fff}.si.on{background:linear-gradient(90deg,rgba(109,124,255,.38),rgba(20,200,180,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.dmain{padding:18px;min-width:0}.dtop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.srch{max-width:260px;margin:0!important;border-radius:20px}
.kp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}.k{border-radius:14px;padding:14px;border:1px solid var(--bd);background:linear-gradient(145deg,rgba(109,124,255,.28),rgba(14,29,56,.7));animation:up .5s ease both;transition:transform .2s}.k:hover{transform:translateY(-3px)}.k:nth-child(2){background:linear-gradient(145deg,rgba(20,200,180,.3),rgba(14,29,56,.7))}.k:nth-child(3){background:linear-gradient(145deg,rgba(163,91,255,.3),rgba(14,29,56,.7))}.k:nth-child(4){background:linear-gradient(145deg,rgba(56,189,248,.26),rgba(14,29,56,.7))}.k small{color:var(--mu)}.k b{display:block;font-size:26px}
.ch{display:grid;gap:12px;grid-template-columns:2fr 1fr;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bw{flex:1;text-align:center}.bar{border-radius:6px 6px 0 0;background:linear-gradient(180deg,#8b7bff,#14c8b4);min-height:4px;animation:up .8s ease both}
.lg span{display:inline-flex;align-items:center;gap:5px;margin:2px 8px 2px 0;font-size:12px;color:var(--mu)}.lg i{width:9px;height:9px;border-radius:50%}
.ln{stroke-dasharray:900;animation:dr 1.8s ease forwards}@keyframes dr{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.dbody h1{font-size:20px}
@media(max-width:900px){.ch{grid-template-columns:1fr}}
@media(max-width:760px){.dsh{grid-template-columns:1fr}.dsb{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}.dsb .logo{display:none}.si{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><nav><a class="logo" href="#home"><i>◉</i>Near Me Help</a><div class="l" id="nl"></div></nav></header>
<main id="app"></main>
<footer><b style="color:#fff">Near Me Help</b> – Trusted Help, Just Around the Corner<br>MVP prototype · Starting in Khairpur, Sindh · All providers, locations, ratings and chat replies are demo data</footer>
<div id="toast"></div>
<script>
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CITY={n:"Khairpur, Sindh",la:27.5295,lo:68.7592};
const seed={
cats:[{id:"doctor",n:"Doctors",i:"🩺"},{id:"teacher",n:"Teachers",i:"📚"},{id:"plumber",n:"Plumbers",i:"🔧"},{id:"electrician",n:"Electricians",i:"⚡"},{id:"mechanic",n:"Mechanics",i:"🚗"},{id:"it",n:"IT Experts",i:"💻"},{id:"carpenter",n:"Carpenters",i:"🪚"},{id:"cleaner",n:"Home Cleaners",i:"🧹"}],
users:[{id:1,name:"Admin",email:"admin@nearme.demo",pw:"admin123",role:"admin"},{id:2,name:"Ayesha Khan",email:"customer@nearme.demo",pw:"demo123",role:"customer",saved:[1,3]},{id:3,name:"Dr. Imran Memon",email:"provider@nearme.demo",pw:"demo123",role:"provider",pid:1}],
provs:[
{id:1,n:"Dr. Imran Memon",c:"doctor",q:"MBBS, FCPS (Medicine)",e:12,f:1000,la:.012,lo:.008,r:4.8,v:1,a:"General physician. Clinic hours 4–9 pm."},
{id:2,n:"Dr. Sana Abro",c:"doctor",q:"MBBS, DGO",e:8,f:1200,la:-.02,lo:.015,r:4.6,v:1,a:"Women and child health consultant."},
{id:3,n:"Sir Farhan Shaikh",c:"teacher",q:"MSc Maths, B.Ed",e:10,f:600,la:.005,lo:-.012,r:4.7,v:1,a:"Matric and Inter maths and physics tutor."},
{id:4,n:"Miss Rabia Soomro",c:"teacher",q:"MA English",e:5,f:500,la:-.008,lo:-.02,r:4.4,v:0,a:"Spoken English and IELTS basics."},
{id:5,n:"Ustad Bashir Ahmed",c:"plumber",q:"Certified Plumber, DAE",e:15,f:800,la:.03,lo:.02,r:4.5,v:1,a:"Leakage, geysers, water motors, fittings."},
{id:6,n:"Zahid Electric Works",c:"electrician",q:"DAE Electrical",e:9,f:700,la:-.015,lo:.03,r:4.3,v:1,a:"House wiring, UPS, solar installation."},
{id:7,n:"Naveed Auto Care",c:"mechanic",q:"Diploma, Automobile",e:11,f:1500,la:.04,lo:-.03,r:4.6,v:0,a:"Car and motorcycle repair, doorstep service."},
{id:8,n:"Adnan Tech Solutions",c:"it",q:"BS Computer Science",e:6,f:1000,la:.002,lo:.025,r:4.9,v:1,a:"Laptop repair, Wi-Fi setup, websites."},
{id:9,n:"Haji Karim Furniture",c:"carpenter",q:"Master Carpenter",e:20,f:900,la:-.035,lo:-.01,r:4.5,v:1,a:"Doors, beds, kitchen cabinets, repair."},
{id:10,n:"Sparkle Home Care",c:"cleaner",q:"Trained Staff",e:4,f:1500,la:.018,lo:-.025,r:4.2,v:0,a:"Deep cleaning for homes and offices."}],
book:[{id:1,cid:2,pid:3,date:"2026-11-12",note:"Maths tuition trial class",st:"completed",rt:5},{id:2,cid:2,pid:1,date:"2026-11-14",note:"General checkup",st:"pending"}],
msgs:[{k:"2-3",f:"p",t:"Welcome! (demo message)",ts:1}]};
const DB={};try{localStorage.getItem("x")}catch(x){}
for(const k in seed){DB[k]=seed[k];try{const v=localStorage.getItem("nmh_"+k);if(v)DB[k]=JSON.parse(v)}catch(x){}}
let meId=null;try{meId=JSON.parse(localStorage.getItem("nmh_me"))}catch(x){}
const save=()=>{try{for(const k in DB)localStorage.setItem("nmh_"+k,JSON.stringify(DB[k]));localStorage.setItem("nmh_me",JSON.stringify(meId))}catch(x){}};
const me=()=>DB.users.find(u=>u.id==meId);const P=id=>DB.provs.find(p=>p.id==id);const U=id=>DB.users.find(u=>u.id==id);const CT=id=>DB.cats.find(c=>c.id==id)||{n:id,i:"🛠️"};
const dist=p=>Math.hypot(p.lo*98.4,p.la*111);
const real=pid=>{const r=DB.book.filter(b=>b.pid==pid&&b.rt);return r.length?{a:(r.reduce((s,b)=>s+b.rt,0)/r.length).toFixed(1),n:r.length}:null};
const rate=p=>{const r=real(p.id);return `<span>★ ${p.r} <span class="badge">DEMO rating</span></span> `+(r?`<span>★ ${r.a} (${r.n}) <span class="badge g">REAL</span></span>`:`<span class="mu">No real ratings yet</span>`)};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2400)};
const go=h=>{location.hash=h};
const ST=["pending","accepted","in-progress","completed","rejected","cancelled"];
let tab="",rad=10,fc="";

function navr(){const u=me(),h=location.hash.slice(1)||"home";
 const L=[["home","Home"],["services","Services"],["find","Find nearby"]].map(([k,t])=>`<a href="#${k}" class="${h==k?"on":""}">${t}</a>`).join("");
 document.getElementById("nl").innerHTML=L+`<span style="flex:1"></span>`+(u?`<a href="#dash" class="${h=="dash"?"on":""}">${e(u.name.split(" ")[0])} · ${u.role}</a><a href="#home" onclick="out()">Logout</a>`:`<a href="#login">Login</a><a href="#register" style="background:var(--t);color:#04302b">Sign up</a>`)}
function out(){meId=null;save();toast("Logged out")}

const pcard=p=>`<div class="card"><div class="row"><div class="av">${CT(p.c).i}</div><div><b>${e(p.n)}</b> ${p.v?`<span class="badge g">✓ Verified</span>`:`<span class="badge">Unverified</span>`}<div class="mu">${e(CT(p.c).n)} · ${p.e} yrs · Rs ${p.f}</div></div></div><div class="mu" style="margin:8px 0">${rate(p)}</div><div class="row sp"><span class="mu">📍 ${dist(p).toFixed(1)} km <span class="badge">DEMO</span></span><a class="btn s" href="#provider-${p.id}">View</a></div></div>`;

function home(){return `<section class="hero"><h1>Trusted Help,<br><em>Just Around the Corner</em></h1><p>Find doctors, teachers, plumbers, electricians, mechanics and IT experts near you in ${CITY.n}. Book in a minute, chat, and track every job.</p><div class="row"><a class="btn" href="#find">Find help near me</a><a class="btn o" style="color:#fff;border-color:#4a6a8f" href="#register">Join as provider</a></div></section>
<h2>Popular services</h2><div class="grid">${DB.cats.map(c=>`<div class="card cat" onclick="fc='${c.id}';go('find')"><b>${c.i}</b>${e(c.n)}</div>`).join("")}</div>
<h2 style="margin-top:30px">How it works</h2><div class="grid"><div class="card"><b>1. Search</b><p class="mu">Pick a service and a distance radius on the map.</p></div><div class="card"><b>2. Book</b><p class="mu">Send a request. The provider accepts or rejects it.</p></div><div class="card"><b>3. Track</b><p class="mu">Follow status from pending to completed, then rate.</p></div></div>
<h2 style="margin-top:30px">What is real and what is simulated</h2><div class="g2"><div class="card"><span class="badge g">REAL (works in your browser)</span><ul class="mu"><li>Registration and login with roles</li><li>Bookings and all 6 statuses</li><li>Saved providers, profile editing</li><li>Admin: categories, users, verification</li><li>Ratings given after completed jobs</li></ul></div><div class="card"><span class="badge">SIMULATED (demo)</span><ul class="mu"><li>Provider locations and the map (no real GPS)</li><li>Starter provider data and starter ratings</li><li>Chat replies from providers (auto-generated)</li><li>Payments, video calls, notifications (not built yet)</li><li>Data lives only in this browser, not on a server</li></ul></div></div>
<h2 style="margin-top:30px">Roadmap</h2><div class="grid">${["Real-time GPS","Live chat (WebSocket)","Video consultations","Online payments (JazzCash, Easypaisa, cards)","Multi-city and multi-country","Server database and SMS/email verification"].map(x=>`<div class="card">🚀 ${x}</div>`).join("")}</div>`}

function services(){return `<h1>Service categories</h1><div class="grid">${DB.cats.map(c=>{const n=DB.provs.filter(p=>p.c==c.id).length;return `<div class="card cat" onclick="fc='${c.id}';go('find')"><b>${c.i}</b>${e(c.n)}<div class="mu">${n} providers</div></div>`}).join("")}</div>`}

function find(){return `<h1>Find help nearby</h1><div class="note">⚠️ DEMO MAP: a simple illustrated map. Locations are sample points around ${CITY.n}, not real addresses. Your position is fixed at the city centre.</div>
<div class="card"><div class="g2"><div><label>Service</label><select onchange="fc=this.value;drawFind()"><option value="">All services</option>${DB.cats.map(c=>`<option value="${c.id}" ${fc==c.id?"selected":""}>${c.i} ${e(c.n)}</option>`).join("")}</select></div><div><label>Distance: <span id="rv">${rad}</span> km</label><input type="range" min="1" max="15" value="${rad}" oninput="rad=+this.value;rv.textContent=rad;drawFind()"></div></div></div><div class="g2" style="margin-top:14px"><div id="mapbox"></div><div id="plist" class="grid" style="grid-template-columns:1fr;align-content:start"></div></div>`}
function drawFind(){const R=rad,list=DB.provs.filter(p=>(!fc||p.c==fc)&&dist(p)<=R).sort((a,b)=>dist(a)-dist(b));
 let s=`<svg class="map" viewBox="0 0 600 400"><g fill="none" stroke="#14b8a6" opacity=".35"><circle cx="300" cy="200" r="180"/><circle cx="300" cy="200" r="120"/><circle cx="300" cy="200" r="60"/></g><path d="M0 120 Q200 160 300 200 T600 300M300 0 L300 400" stroke="#9fb4c8" stroke-width="6" fill="none" opacity=".4"/><text x="12" y="22" font-size="13" fill="#5b6b7e">DEMO MAP · scale ring = ${R} km</text><circle cx="300" cy="200" r="9" fill="#0b2545" stroke="#fff" stroke-width="3"/><text x="312" y="215" font-size="12" fill="#5b6b7e">You (demo)</text>`;
 list.forEach(p=>{const x=300+p.lo*98.4/R*180,y=200-p.la*111/R*180;s+=`<g style="cursor:pointer" onclick="go('provider-${p.id}')"><circle cx="${x}" cy="${y}" r="15" fill="#14b8a6" stroke="#0b2545" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15">${CT(p.c).i}</text></g>`});
 mapbox.innerHTML=s+`</svg>`;plist.innerHTML=list.length?list.map(pcard).join(""):`<div class="card mu">No providers in this radius. Try increasing the distance.</div>`}

function provider(id){const p=P(id);if(!p)return `<p>Not found</p>`;const u=me(),saved=u&&u.saved&&u.saved.includes(p.id);
 return `<a href="#find">← Back</a><div class="g2" style="margin-top:10px"><div class="card"><div class="row"><div class="av" style="width:64px;height:64px;font-size:32px">${CT(p.c).i}</div><div><h2 style="margin:0">${e(p.n)}</h2>${p.v?`<span class="badge g">✓ Verified by admin</span>`:`<span class="badge">Not verified yet</span>`} <span class="badge">DEMO profile</span></div></div>
 <p>${e(p.a)}</p><table><tr><th>Category</th><td>${e(CT(p.c).n)}</td></tr><tr><th>Qualification</th><td>${e(p.q)}</td></tr><tr><th>Experience</th><td>${p.e} years</td></tr><tr><th>Charges</th><td>Rs ${p.f} per visit</td></tr><tr><th>Distance</th><td>${dist(p).toFixed(1)} km (demo)</td></tr></table><p>${rate(p)}</p>
 <div class="row">${u&&u.role=="customer"?`<button class="btn o" onclick="sv(${p.id})">${saved?"★ Saved":"☆ Save"}</button><a class="btn n" href="#chat-${u.id}-${p.id}">Message</a>`:""}</div></div>
 <div class="card"><h3>Book this provider</h3>${u&&u.role=="customer"?`<label>Preferred date</label><input type="date" id="bd"><label>What do you need?</label><textarea id="bn" rows="3"></textarea><button class="btn" onclick="bk(${p.id})">Send booking request</button>`:`<p class="mu">${u?"Only customer accounts can book.":"Please log in as a customer to book."}</p>${u?"":`<a class="btn" href="#login">Login</a>`}`}
 <h3 style="margin-top:18px">Real reviews</h3>${DB.book.filter(b=>b.pid==p.id&&b.rt).map(b=>`<div class="mu">★ ${b.rt} – ${e(U(b.cid)?.name||"")} <span class="badge g">REAL</span></div>`).join("")||`<p class="mu">None yet. Ratings appear after a completed booking.</p>`}</div></div>`}
function sv(id){const u=me();u.saved=u.saved||[];const i=u.saved.indexOf(id);i<0?u.saved.push(id):u.saved.splice(i,1);save();route()}
function bk(pid){const d=bd.value,n=bn.value.trim();if(!d||!n)return toast("Add a date and a note");DB.book.push({id:Date.now(),cid:meId,pid,date:d,note:n,st:"pending"});save();toast("Request sent");tab="b";go("dash")}

function login(){return `<div class="auth"><div class="side"><div class="logo" style="margin-bottom:18px"><i>◉</i>Near Me Help</div><h2>Trusted Help, Just Around the Corner</h2><ul><li>Verified local providers</li><li>Book in under a minute</li><li>Track every job status</li></ul></div><div class="form"><h2>Welcome back</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button class="btn" style="width:100%" onclick="doLogin()">Login</button><div class="note"><b>Demo accounts</b> (password in brackets)<br>Admin: admin@nearme.demo (admin123)<br>Customer: customer@nearme.demo (demo123)<br>Provider: provider@nearme.demo (demo123)</div><p class="mu">New here? <a href="#register">Create an account</a></p></div></div>`}
function doLogin(){const u=DB.users.find(u=>u.email==em.value.trim().toLowerCase()&&u.pw==pw.value);if(!u)return toast("Wrong email or password");meId=u.id;tab="";save();go("dash")}
function register(){return `<div class="auth"><div class="side"><div class="logo" style="margin-bottom:18px"><i>◉</i>Near Me Help</div><h2>Join your local community</h2><ul><li>Customers: find trusted help nearby</li><li>Providers: get bookings and grow</li><li>Free to start in Khairpur</li></ul></div><div class="form"><h2>Create your account</h2><label>I am a</label><select id="rr" onchange="pf.style.display=this.value=='provider'?'block':'none'"><option value="customer">Customer</option><option value="provider">Service provider</option></select><label>Full name</label><input id="rn"><label>Email</label><input id="re" type="email"><label>Password (min 6)</label><input id="rp" type="password">
<div id="pf" style="display:none"><label>Service category</label><select id="rc">${DB.cats.map(c=>`<option value="${c.id}">${e(c.n)}</option>`).join("")}</select><label>Qualification</label><input id="rq"><label>Experience (years)</label><input id="rx" type="number" min="0"><label>Charges per visit (Rs)</label><input id="rf" type="number" min="0"></div>
<button class="btn" style="width:100%" onclick="doReg()">Sign up</button><div class="note">Demo auth: accounts are stored only in this browser. A real launch needs a secure server with hashed passwords.</div></div></div>`}
function doReg(){const em=re.value.trim().toLowerCase();if(!rn.value.trim()||!em.includes("@")||rp.value.length<6)return toast("Fill all fields (password 6+ chars)");if(DB.users.some(u=>u.email==em))return toast("Email already registered");
 const u={id:Date.now(),name:rn.value.trim(),email:em,pw:rp.value,role:rr.value,saved:[]};
 if(u.role=="provider"){const p={id:Date.now()+1,n:u.name,c:rc.value,q:rq.value||"Not provided",e:+rx.value||0,f:+rf.value||500,la:(Math.random()-.5)*.04,lo:(Math.random()-.5)*.04,r:0,v:0,a:"New provider on Near Me Help.",own:1};DB.provs.push(p);u.pid=p.id}
 DB.users.push(u);meId=u.id;tab="";save();toast("Welcome!");go("dash")}

const stb=s=>`<span class="st ${s}">${s}</span>`;
function dash(){const u=me();if(!u){go("login");return ""}
 const inner=u.role=="customer"?cdash(u):u.role=="provider"?pdash(u):adash();return shell(u,inner)}
const PAL=["#14c8b4","#8b7bff","#a35bff","#38bdf8","#f59e0b","#ec4899"];
const sk=(v,c)=>{const m=Math.max(...v),n=v.length;return `<svg viewBox="0 0 120 40" width="100%" height="40"><polyline points="${v.map((y,i)=>`${i*120/(n-1)},${37-y/m*32}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
const myB=u=>u.role=="admin"?DB.book:DB.book.filter(b=>u.role=="customer"?b.cid==u.id:b.pid==u.pid);
function shell(u,inner){const ic={b:"📋",m:"💬",s:"⭐",p:"👤",v:"✅",u:"👥",c:"🗂️"};
 const side=TL.map(([k,t])=>`<a class="si ${tab==k?"on":""}" onclick="tab='${k}';route()">${ic[k]||"•"} ${t}</a>`).join("");
 return `<div class="dsh"><aside class="dsb"><div class="logo"><i>◉</i>Near Me Help</div>${side}<a class="si" href="#find">🔎 Find nearby</a><a class="si" href="#home" onclick="out()">🚪 Logout</a></aside><section class="dmain"><div class="dtop"><input class="srch" placeholder="Search (demo, not active)" disabled><div class="row"><span class="badge">Trend lines = DEMO</span><div class="av" style="width:36px;height:36px;font-size:14px">${e(u.name.slice(0,2).toUpperCase())}</div><span>${e(u.name)}</span></div></div>${kp(u)}${charts(u)}<div class="dbody">${inner}</div></section></div>`}
function kp(u){const B=myB(u),n=s=>B.filter(b=>b.st==s).length,fee=u.role=="provider"?(P(u.pid)?.f||0):0;
 const K=u.role=="admin"?[["Total users",DB.users.length],["Providers",DB.provs.length],["Verified",DB.provs.filter(p=>p.v).length],["Bookings",B.length]]:u.role=="customer"?[["My bookings",B.length],["Pending",n("pending")],["Completed",n("completed")],["Saved",(u.saved||[]).length]]:[["Bookings",B.length],["Pending",n("pending")],["Completed",n("completed")],["Est. earnings","Rs "+n("completed")*fee]];
 const S=[[3,5,4,7,6,9,8,12],[2,4,3,6,5,7,9,8],[5,4,6,5,8,7,9,11],[4,6,5,8,6,9,7,10]];
 return `<div class="kp">${K.map(([t,v],i)=>`<div class="k"><small>${t}</small><b>${v}</b>${sk(S[i],PAL[i])}</div>`).join("")}</div>`}
function charts(u){const B=myB(u),d=[20,34,28,45,40,58,70],lb=["Jun","Jul","Aug","Sep","Oct","Nov","Dec"],pt=d.map((y,i)=>[20+i*60,150-y*1.8]),L=pt.map(p=>p.join(",")).join(" ");
 const line=`<svg viewBox="0 0 400 170" width="100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7bff" stop-opacity=".45"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></linearGradient></defs><polygon points="20,150 ${L} 380,150" fill="url(#ag)"/><polyline class="ln" points="${L}" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/><circle cx="380" cy="${pt[6][1]}" r="6" fill="#14c8b4" stroke="#fff" stroke-width="2"/>${lb.map((t,i)=>`<text x="${20+i*60}" y="166" font-size="10" fill="#9aabbf" text-anchor="middle">${t}</text>`).join("")}</svg>`;
 const cc=DB.cats.map(c=>[c.n,DB.provs.filter(p=>p.c==c.id).length]).filter(x=>x[1]),T=cc.reduce((s,x)=>s+x[1],0)||1;let a=0;
 const dn=`<svg viewBox="0 0 100 100" width="150" style="display:block;margin:auto;transform:rotate(-90deg)">${cc.map((x,i)=>{const l=x[1]/T*251.3,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${PAL[i%6]}" stroke-width="14" stroke-dasharray="${l-1} ${251.3-l+1}" stroke-dashoffset="${-a}"/>`;a+=l;return s}).join("")}</svg><div class="lg">${cc.map((x,i)=>`<span><i style="background:${PAL[i%6]}"></i>${e(x[0])} ${x[1]}</span>`).join("")}</div>`;
 const mx=Math.max(1,...ST.map(s=>B.filter(b=>b.st==s).length)),bars=`<div class="bars">${ST.map(s=>{const c=B.filter(b=>b.st==s).length;return `<div class="bw"><small>${c}</small><div class="bar" style="height:${c/mx*100}px"></div><small class="mu">${s.replace("in-progress","active")}</small></div>`}).join("")}</div>`;
 return `<div class="ch"><div class="card"><b>Activity trend</b> <span class="badge">DEMO data</span>${line}</div><div class="card"><b>Providers by category</b> <span class="badge g">REAL</span>${dn}</div></div><div class="card" style="margin-bottom:14px"><b>${u.role=="admin"?"All":"My"} bookings by status</b> <span class="badge g">REAL</span>${bars}</div>`}
let TL=[];const tabs=a=>{TL=a;return ""};
function cdash(u){tab=tab||"b";let b=tabs([["b","My bookings"],["m","Messages"],["s","Saved providers"]]);
 if(tab=="b"){const l=DB.book.filter(x=>x.cid==u.id).reverse();b+=l.map(x=>{const p=P(x.pid);return `<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${e(p?.n)}</b>${stb(x.st)}</div><div class="mu">${e(x.date)} · ${e(x.note)}</div><div class="row" style="margin-top:8px">${["pending","accepted"].includes(x.st)?`<button class="btn d s" onclick="ss(${x.id},'cancelled')">Cancel</button>`:""}${x.st=="completed"?(x.rt?`<span>Your rating: ★ ${x.rt} <span class="badge g">REAL</span></span>`:`Rate: ${[1,2,3,4,5].map(n=>`<button class="btn o s" onclick="rt(${x.id},${n})">${n}★</button>`).join("")}`):""}</div></div>`}).join("")||`<p class="mu">No bookings yet. <a href="#find">Find a provider</a></p>`}
 if(tab=="m"){const ks=[...new Set(DB.msgs.filter(m=>m.k.startsWith(u.id+"-")).map(m=>m.k))];b+=ks.map(k=>`<a class="card" style="display:block;margin-bottom:8px" href="#chat-${k}">💬 ${e(P(k.split("-")[1])?.n)}</a>`).join("")||`<p class="mu">No conversations. Open a provider profile and press Message.</p>`}
 if(tab=="s")b+=`<div class="grid">${(u.saved||[]).map(id=>P(id)).filter(Boolean).map(pcard).join("")||`<p class="mu">Nothing saved yet.</p>`}</div>`;
 return `<h1>Hello, ${e(u.name)} 👋</h1>`+b}
function ss(id,s){DB.book.find(x=>x.id==id).st=s;save();route()}
function rt(id,n){DB.book.find(x=>x.id==id).rt=n;save();toast("Thanks for rating");route()}
function pdash(u){const p=P(u.pid);tab=tab||"b";let b=tabs([["b","Bookings"],["p","My profile"],["m","Messages"]]);
 if(tab=="b"){const l=DB.book.filter(x=>x.pid==p.id).reverse();const nx={pending:[["accepted","Accept","btn s"],["rejected","Reject","btn d s"]],accepted:[["in-progress","Start job","btn s"]],"in-progress":[["completed","Mark completed","btn s"]]};
 b+=l.map(x=>`<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${e(U(x.cid)?.name)}</b>${stb(x.st)}</div><div class="mu">${e(x.date)} · ${e(x.note)}</div><div class="row" style="margin-top:8px">${(nx[x.st]||[]).map(([s,t,c])=>`<button class="${c}" onclick="ss(${x.id},'${s}')">${t}</button>`).join("")}</div></div>`).join("")||`<p class="mu">No booking requests yet.</p>`}
 if(tab=="p")b+=`<div class="card" style="max-width:520px">${p.v?`<span class="badge g">✓ Verified</span>`:`<span class="badge">Awaiting admin verification</span>`}<label>Qualification</label><input id="pq" value="${e(p.q)}"><label>Experience (years)</label><input id="px" type="number" value="${p.e}"><label>Charges (Rs)</label><input id="pfee" type="number" value="${p.f}"><label>About</label><textarea id="pa" rows="3">${e(p.a)}</textarea><button class="btn" onclick="sp()">Save profile</button></div>`;
 if(tab=="m"){const ks=[...new Set(DB.msgs.filter(m=>m.k.endsWith("-"+p.id)).map(m=>m.k))];b+=ks.map(k=>`<a class="card" style="display:block;margin-bottom:8px" href="#chat-${k}">💬 ${e(U(k.split("-")[0])?.name)}</a>`).join("")||`<p class="mu">No messages yet.</p>`}
 return `<h1>Provider dashboard</h1>`+b}
function sp(){const p=P(me().pid);p.q=pq.value;p.e=+px.value;p.f=+pfee.value;p.a=pa.value;save();toast("Profile saved")}
function adash(){tab=tab||"v";let b=tabs([["v","Provider verification"],["u","Users"],["c","Categories"]]);
 if(tab=="v")b+=`<div class="tw card"><table><tr><th>Provider</th><th>Category</th><th>Source</th><th>Status</th><th></th></tr>${DB.provs.map(p=>`<tr><td>${e(p.n)}</td><td>${e(CT(p.c).n)}</td><td>${p.own?"Registered":"Demo"}</td><td>${p.v?"Verified":"Unverified"}</td><td><button class="btn s" onclick="vf(${p.id})">${p.v?"Revoke":"Verify"}</button></td></tr>`).join("")}</table></div><p class="mu">Demo note: real verification would review CNIC and certificates; here it is a simple toggle.</p>`;
 if(tab=="u")b+=`<div class="tw card"><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${DB.users.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.email)}</td><td>${x.role}</td><td>${x.role=="admin"?"":`<button class="btn d s" onclick="du(${x.id})">Remove</button>`}</td></tr>`).join("")}</table></div>`;
 if(tab=="c")b+=`<div class="card"><div class="row"><input id="ci" placeholder="Emoji" style="width:80px"><input id="cn" placeholder="New category name" style="flex:1;min-width:160px"><button class="btn" onclick="ac()">Add</button></div>${DB.cats.map(c=>`<div class="row sp" style="padding:6px 0;border-top:1px solid var(--bd)"><span>${c.i} ${e(c.n)}</span><button class="btn d s" onclick="dc('${c.id}')">Delete</button></div>`).join("")}</div>`;
 return `<h1>Admin dashboard</h1>`+b}
function vf(id){const p=P(id);p.v=p.v?0:1;save();route()}
function du(id){const u=U(id);if(u.pid)DB.provs=DB.provs.filter(p=>p.id!=u.pid);DB.users=DB.users.filter(x=>x.id!=id);save();route()}
function ac(){if(!cn.value.trim())return;DB.cats.push({id:"c"+Date.now(),n:cn.value.trim(),i:ci.value||"🛠️"});save();route()}
function dc(id){DB.cats=DB.cats.filter(c=>c.id!=id);save();route()}

function chat(cid,pid){const u=me();if(!u){go("login");return ""}const k=cid+"-"+pid,p=P(pid),isP=u.role=="provider";
 const ms=DB.msgs.filter(m=>m.k==k);
 return `<a href="#dash">← Dashboard</a><h2 style="margin-top:10px">Chat with ${e(isP?U(cid)?.name:p?.n)}</h2><div class="note">💬 DEMO CHAT: messages are saved only in this browser. Replies from providers are auto-generated (simulated). Real-time live chat is on the roadmap.</div>
 <div class="chat" id="cb">${ms.map(m=>`<div class="m ${(m.f=="c")!=isP&&m.f!="s"?"me":""}">${e(m.t)}${m.f=="s"?` <span class="badge">SIMULATED</span>`:""}</div>`).join("")||`<span class="mu">Say hello 👋</span>`}</div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="ct" placeholder="Type a message" style="margin:0" onkeydown="if(event.key=='Enter')sm('${k}',${isP})"><button class="btn" onclick="sm('${k}',${isP})">Send</button></div>`}
function sm(k,isP){const t=ct.value.trim();if(!t)return;DB.msgs.push({k,f:isP?"p":"c",t,ts:Date.now()});save();route();
 if(!isP)setTimeout(()=>{DB.msgs.push({k,f:"s",t:"Thanks for your message! I will confirm availability shortly.",ts:Date.now()});save();if(location.hash.slice(1)=="chat-"+k)route()},1200)}

function route(){const h=location.hash.slice(1)||"home",[a,b,c]=h.split("-");let o="";
 if(a=="home")o=home();else if(a=="services")o=services();else if(a=="find")o=find();else if(a=="provider")o=provider(b);else if(a=="login")o=login();else if(a=="register")o=register();else if(a=="dash")o=dash();else if(a=="chat")o=chat(b,c);else o=home();
 app.innerHTML=o;navr();if(a=="find")drawFind();const cb=document.getElementById("cb");if(cb)cb.scrollTop=1e6;if(a!="dash"&&a!="chat")scrollTo(0,0)}
window.addEventListener("hashchange",()=>{tab="";route()});route();
</script></body></html>
